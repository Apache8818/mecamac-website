le><text x="500" y="218" text-anchor="middle" class="dgs">SUPPLY  →</text><text x="560" y="470" text-anchor="middle" class="dgs">←  RETURN</text><text x="70" y="586" class="dgcap">LOAD MODELLED FIRST · PLANT STAGED TO HOLD EFFICIENCY AT PART LOAD</text>
</svg>