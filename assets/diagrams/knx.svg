<svg class="sysdiag" viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KNX bus topology showing sensors and actuators on a single wired bus with a BMS head-end" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .dgshell{fill:none;stroke:#2E7C97;stroke-width:2}
    .dgbox rect{fill:#0E2436;stroke:#2E7C97;stroke-width:1.5}
    .dgbox.dgb rect{fill:#0C1E30;stroke:#1E5A73}
    .dgt{fill:#FFFFFF;font-family:Sora,Arial,sans-serif;font-size:15px;font-weight:600}
    .dgs{fill:#9ADDF0;font-family:Sora,Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:1.4px}
    .dgcap{fill:#2E7C97;font-family:Sora,Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:2.4px}
    .dglab{font-family:Sora,Arial,sans-serif;font-size:26px;font-weight:800}
    .dgcM{fill:#56C6E6}.dgcE{fill:#9ADDF0}.dgcP{fill:#2E7C97}
    .dgrun{fill:none;stroke:#56C6E6;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .dgrun.dgM{stroke:#56C6E6}
    .dgrun.dgE{stroke:#9ADDF0}
    .dgrun.dgP{stroke:#2E7C97}
    .dgrun.dgRet{stroke:#9ADDF0;opacity:.75}
    .dgbus{fill:none;stroke:#56C6E6;stroke-width:4;stroke-linecap:round}
    .dgnode circle{fill:#56C6E6}
    .dgterm{fill:#56C6E6;opacity:.55}
    .dgterm2{fill:#2E7C97}
    .dgpulse{opacity:.95}
  </style>
<defs>
  <linearGradient id="dgBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00111C"/><stop offset="55%" stop-color="#0A1B2A"/><stop offset="100%" stop-color="#002E4B"/>
  </linearGradient>
  <pattern id="dgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#56C6E6" stroke-width="1" opacity=".06"/>
  </pattern>
  <filter id="dgGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1180" height="620" fill="url(#dgBg)" rx="14"/>
<rect width="1180" height="620" fill="url(#dgGrid)" rx="14"/>
<g class="dgbox"><rect x="60" y="250" width="150" height="84" rx="8"/><text x="135.0" y="287.0" text-anchor="middle" class="dgt">Head-End</text><text x="135.0" y="307.0" text-anchor="middle" class="dgs">BMS / visualisation</text></g><path class="dgbus" d="M270 292h820"/><path class="dgrun" d="M210 292h60" /><circle class="dgpulse" r="5" fill="#56C6E6" filter="url(#dgGlow)"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M240 292h850"/></circle><circle class="dgpulse" r="5" fill="#9ADDF0" filter="url(#dgGlow)"><animateMotion dur="5s" begin="2.5s" repeatCount="indefinite" path="M1090 292H240"/></circle><text x="600" y="272" text-anchor="middle" class="dgs">KNX TWISTED-PAIR BUS · RUNS WITHOUT THE NETWORK</text><path class="dgrun" d="M330 292V190"/><g class="dgbox"><rect x="268" y="130" width="124" height="60" rx="8"/><text x="330.0" y="165.0" text-anchor="middle" class="dgt">Presence</text></g><g class="dgnode"><circle cx="330" cy="292" r="7"/><text x="330" y="276" text-anchor="middle" class="dgs"></text></g><path class="dgrun" d="M500 292V190"/><g class="dgbox"><rect x="438" y="130" width="124" height="60" rx="8"/><text x="500.0" y="165.0" text-anchor="middle" class="dgt">Daylight</text></g><g class="dgnode"><circle cx="500" cy="292" r="7"/><text x="500" y="276" text-anchor="middle" class="dgs"></text></g><path class="dgrun" d="M670 292V190"/><g class="dgbox"><rect x="608" y="130" width="124" height="60" rx="8"/><text x="670.0" y="165.0" text-anchor="middle" class="dgt">Panel</text></g><g class="dgnode"><circle cx="670" cy="292" r="7"/><text x="670" y="276" text-anchor="middle" class="dgs"></text></g><path class="dgrun" d="M840 292V190"/><g class="dgbox"><rect x="778" y="130" width="124" height="60" rx="8"/><text x="840.0" y="165.0" text-anchor="middle" class="dgt">Thermostat</text></g><g class="dgnode"><circle cx="840" cy="292" r="7"/><text x="840" y="276" text-anchor="middle" class="dgs"></text></g><path class="dgrun" d="M1010 292V190"/><g class="dgbox"><rect x="948" y="130" width="124" height="60" rx="8"/><text x="1010.0" y="165.0" text-anchor="middle" class="dgt">Weather</text></g><g class="dgnode"><circle cx="1010" cy="292" r="7"/><text x="1010" y="276" text-anchor="middle" class="dgs"></text></g><path class="dgrun" d="M330 292v104"/><g class="dgbox"><rect x="268" y="396" width="124" height="60" rx="8"/><text x="330.0" y="431.0" text-anchor="middle" class="dgt">Lighting</text></g><path class="dgrun" d="M500 292v104"/><g class="dgbox"><rect x="438" y="396" width="124" height="60" rx="8"/><text x="500.0" y="431.0" text-anchor="middle" class="dgt">Dimming</text></g><path class="dgrun" d="M670 292v104"/><g class="dgbox"><rect x="608" y="396" width="124" height="60" rx="8"/><text x="670.0" y="431.0" text-anchor="middle" class="dgt">Blinds</text></g><path class="dgrun" d="M840 292v104"/><g class="dgbox"><rect x="778" y="396" width="124" height="60" rx="8"/><text x="840.0" y="431.0" text-anchor="middle" class="dgt">Fan Coil</text></g><path class="dgrun" d="M1010 292v104"/><g class="dgbox"><rect x="948" y="396" width="124" height="60" rx="8"/><text x="1010.0" y="431.0" text-anchor="middle" class="dgt">Façade</text></g><text x="60" y="586" class="dgcap">SENSORS IN · ACTUATORS OUT · ONE BUS, ONE LOGIC, NO CLOUD DEPENDENCY</text>
</svg>