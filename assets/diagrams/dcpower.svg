<svg class="sysdiag" viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data centre electrical topology showing two independent N+N power paths from utility supply to rack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .dgshell{fill:none;stroke:#2E7C97;stroke-width:2}
    .dgbox rect{fill:#0E2436;stroke:#2E7C97;stroke-width:1.5}
    .dgbox.dgb rect{fill:#0C1E30;stroke:#1E5A73}
    .dgt{fill:#FFFFFF;font-family:Sora,Arial,sans-serif;font-size:15px;font-weight:600}
    .dgs{fill:#9ADDF0;font-family:Sora,Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:1.4px}
    .dgcap{fill:#2E7C97;font-family:Sora,Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:2.4px}
    .dglab{font-family:Sora,Arial,sans-serif;font-size:26px;font-weight:800}
    .dgcM{fill:#56C6E6}.dgcE{fill:#9ADDF0}.dgcP{fill:#2E7C97}
    .dgrun{fill:none;stroke:#56C6E6;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .dgrun.dgM{stroke:#56C6E6}
    .dgrun.dgE{stroke:#9ADDF0}
    .dgrun.dgP{stroke:#2E7C97}
    .dgrun.dgRet{stroke:#9ADDF0;opacity:.75}
    .dgbus{fill:none;stroke:#56C6E6;stroke-width:4;stroke-linecap:round}
    .dgnode circle{fill:#56C6E6}
    .dgterm{fill:#56C6E6;opacity:.55}
    .dgterm2{fill:#2E7C97}
    .dgpulse{opacity:.95}
  </style>
<defs>
  <linearGradient id="dgBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00111C"/><stop offset="55%" stop-color="#0A1B2A"/><stop offset="100%" stop-color="#002E4B"/>
  </linearGradient>
  <pattern id="dgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#56C6E6" stroke-width="1" opacity=".06"/>
  </pattern>
  <filter id="dgGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1180" height="620" fill="url(#dgBg)" rx="14"/>
<rect width="1180" height="620" fill="url(#dgGrid)" rx="14"/>
